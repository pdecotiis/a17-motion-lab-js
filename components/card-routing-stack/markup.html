<section class="card-routing-stack" data-motion-target data-motion="card-routing-stack">
  <div class="card-routing-stack__stage" data-motion="stage">
      <div class="card-routing-stack__cell" data-motion="m-card"><div data-motion="shape-1" class="card-routing-stack__fill card-routing-stack__card card-routing-stack__card--orange"><div class="card-routing-stack__route" data-motion="route-m-card"><p class="card-routing-stack__title">Machine Learning</p><span class="card-routing-stack__circle" data-motion="circle"><img class="card-routing-stack__arrow" src="assets/arrow-dark.svg" alt=""></span></div></div></div>
      <div class="card-routing-stack__cell" data-motion="e-card"><div data-motion="shape-3" class="card-routing-stack__fill card-routing-stack__card card-routing-stack__card--yellow"><div class="card-routing-stack__route" data-motion="route-e-card"><p class="card-routing-stack__title">Technology</p><span class="card-routing-stack__circle" data-motion="circle"><img class="card-routing-stack__arrow" src="assets/arrow-dark.svg" alt=""></span></div></div></div>
      <div class="card-routing-stack__cell" data-motion="t-pic"><div data-motion="shape-2" class="card-routing-stack__fill"><img data-motion="pic-2" class="card-routing-stack__pic" src="assets/trading-large.jpg" alt="" decoding="sync"></div></div>
      <div class="card-routing-stack__cell" data-motion="m-pic"><div data-motion="shape-1" class="card-routing-stack__fill"><img data-motion="pic-1" class="card-routing-stack__pic" src="assets/machine-learning-large.jpg" alt="" decoding="sync"></div></div>
      <div class="card-routing-stack__cell" data-motion="e-pic"><div data-motion="shape-3" class="card-routing-stack__fill"><img data-motion="pic-3" class="card-routing-stack__pic" src="assets/technology-large.jpg" alt="" decoding="sync"></div></div>
      <div class="card-routing-stack__cell" data-motion="t-card"><div data-motion="shape-2" class="card-routing-stack__fill card-routing-stack__card card-routing-stack__card--indigo"><div class="card-routing-stack__route" data-motion="route-t-card"><p class="card-routing-stack__title">Trading</p><span class="card-routing-stack__circle" data-motion="circle"><img class="card-routing-stack__arrow" src="assets/arrow-dark.svg" alt=""></span></div></div></div>
  </div>
  <div class="card-routing-stack__bar">
    <div class="card-routing-stack__dots" data-motion="dots" role="group" aria-label="Slides">
      <button type="button" class="card-routing-stack__dot" data-motion="dot-1" aria-label="Show slide 1"><span class="card-routing-stack__dot-fill"></span></button>
      <button type="button" class="card-routing-stack__dot" data-motion="dot-2" aria-label="Show slide 2"><span class="card-routing-stack__dot-fill"></span></button>
      <button type="button" class="card-routing-stack__dot" data-motion="dot-3" aria-label="Show slide 3"><span class="card-routing-stack__dot-fill"></span></button>
    </div>
  </div>
</section>
