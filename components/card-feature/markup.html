<section class="card-feature" data-motion-target data-motion="card-feature">
  <div class="card-feature__container" data-motion="container">
    <div class="card-feature__card" data-motion="card">
      <div class="card-feature__image" data-motion="image">
        <img class="card-feature__chart" src="assets/chart.png" alt="">
      </div>
      <div class="card-feature__protection card-feature__protection--1" data-motion="protection-1">
        <div class="card-feature__blob card-feature__blob--1"><img src="assets/text-protection-1.svg" alt=""></div>
      </div>
      <div class="card-feature__protection card-feature__protection--2" data-motion="protection-2">
        <div class="card-feature__blob card-feature__blob--2"><img src="assets/text-protection-2.svg" alt=""></div>
      </div>
      <div class="card-feature__content" data-motion="content">
        <div class="card-feature__title-lockup" data-motion="title-lockup">
          <div class="card-feature__heading" data-motion="heading">
            <div class="card-feature__eyebrow" data-motion="eyebrow">
              <span class="card-feature__bullet" data-motion="bullet"></span>
              <p class="card-feature__label" data-motion="label" data-scramble>Eyebrow</p>
            </div>
            <h2 class="card-feature__title" data-motion="title">Partner with us</h2>
          </div>
          <p class="card-feature__text" data-motion="text">We commit our capital, global reach, technology, and expertise to help institutions meet their trading goals.</p>
        </div>
        <div class="card-feature__action" data-motion="action">
          <span class="card-feature__button" data-motion="button"><img src="assets/arrow-right.svg" width="24" height="24" alt=""></span>
        </div>
      </div>
    </div>
  </div>
</section>
