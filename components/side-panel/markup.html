<aside class="side-panel" data-motion-target aria-label="Notification settings">
  <header class="side-panel__header">
    <h2 class="side-panel__title" data-motion="title">Notifications</h2>
    <button type="button" class="side-panel__close" aria-label="Close panel">×</button>
  </header>
  <ul class="side-panel__list" data-motion="list">
    <li class="side-panel__row"><span>Comments</span><span class="side-panel__switch side-panel__switch--on" aria-hidden="true"></span></li>
    <li class="side-panel__row"><span>Mentions</span><span class="side-panel__switch side-panel__switch--on" aria-hidden="true"></span></li>
    <li class="side-panel__row"><span>Weekly digest</span><span class="side-panel__switch" aria-hidden="true"></span></li>
  </ul>
  <footer class="side-panel__actions" data-motion="actions">
    <button type="button" class="side-panel__button">Cancel</button>
    <button type="button" class="side-panel__button side-panel__button--primary">Save</button>
  </footer>
</aside>
