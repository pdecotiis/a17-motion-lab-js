<section class="card-routing-shuffle" data-motion-target data-motion="card-routing-shuffle">
  <div class="card-routing-shuffle__grid" data-motion="grid">
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--pic" data-motion="c1"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--indigo" data-motion="c2"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--green" data-motion="c3"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--pic" data-motion="c4"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--pic" data-motion="c5"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--pic" data-motion="c6"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--yellow" data-motion="c7"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--pic" data-motion="c8"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--video" data-motion="c9"><span class="card-routing-shuffle__play" aria-hidden="true"></span></div>
