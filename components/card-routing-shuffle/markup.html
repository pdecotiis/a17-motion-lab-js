<section class="card-routing-shuffle" data-motion-target data-motion="card-routing-shuffle">
  <div class="card-routing-shuffle__grid" data-motion="grid">
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p01"><img class="card-routing-shuffle__photo" src="assets/photo-1.png" alt="" data-motion="photo-p01"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p02"><img class="card-routing-shuffle__photo" src="assets/photo-2.png" alt="" data-motion="photo-p02"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--yellow" data-motion="y0"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--indigo" data-motion="i0"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--video" data-motion="v0"><img class="card-routing-shuffle__photo" src="assets/photo-3.png" alt="" data-motion="photo-v0"><span class="card-routing-shuffle__play" aria-hidden="true"></span></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--green" data-motion="g1"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--indigo" data-motion="i1"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p11"><img class="card-routing-shuffle__photo" src="assets/photo-4.png" alt="" data-motion="photo-p11"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p12"><img class="card-routing-shuffle__photo" src="assets/photo-1.png" alt="" data-motion="photo-p12"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--video" data-motion="v1"><img class="card-routing-shuffle__photo" src="assets/photo-2.png" alt="" data-motion="photo-v1"><span class="card-routing-shuffle__play" aria-hidden="true"></span></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p22"><img class="card-routing-shuffle__photo" src="assets/photo-3.png" alt="" data-motion="photo-p22"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--green" data-motion="g2"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p21"><img class="card-routing-shuffle__photo" src="assets/photo-4.png" alt="" data-motion="photo-p21"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--video" data-motion="v2"><img class="card-routing-shuffle__photo" src="assets/photo-1.png" alt="" data-motion="photo-v2"><span class="card-routing-shuffle__play" aria-hidden="true"></span></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--yellow" data-motion="y2"></div>
  </div>
  <button type="button" class="card-routing-shuffle__shuffle" data-motion="shuffle">Shuffle</button>
</section>
