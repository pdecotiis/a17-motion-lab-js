<section class="card-routing-shuffle" data-motion-target data-motion="card-routing-shuffle">
  <div class="card-routing-shuffle__grid" data-motion="grid">
    <div class="card-routing-shuffle__col">
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--yellow" data-motion="y0"><div class="card-routing-shuffle__inner"><p class="card-routing-shuffle__title" data-motion="title-y0">Machine Learning</p><img class="card-routing-shuffle__arrow" src="assets/arrow-dark.svg" width="24" height="24" alt="" data-motion="arrow-y0"></div></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p0"><img class="card-routing-shuffle__photo" src="assets/photo-1.jpg" alt="" decoding="sync"></div>
    </div>
    <div class="card-routing-shuffle__col">
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p1"><img class="card-routing-shuffle__photo" src="assets/photo-2.jpg" alt="" decoding="sync"></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--indigo" data-motion="i1"><div class="card-routing-shuffle__inner"><p class="card-routing-shuffle__title" data-motion="title-i1">Trading</p><img class="card-routing-shuffle__arrow" src="assets/arrow-dark.svg" width="24" height="24" alt="" data-motion="arrow-i1"></div></div>
    </div>
    <div class="card-routing-shuffle__col">
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--green" data-motion="g2"><div class="card-routing-shuffle__inner"><p class="card-routing-shuffle__title" data-motion="title-g2">Technology</p><img class="card-routing-shuffle__arrow" src="assets/arrow-light.svg" width="24" height="24" alt="" data-motion="arrow-g2"></div></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--video" data-motion="v2"><img class="card-routing-shuffle__photo" src="assets/photo-3.jpg" alt="" decoding="sync"><span class="card-routing-shuffle__play" aria-hidden="true"></span></div>
    </div>
  </div>
  <button type="button" class="card-routing-shuffle__shuffle" data-motion="shuffle">Shuffle</button>
</section>
