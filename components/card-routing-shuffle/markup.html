<section class="card-routing-shuffle" data-motion-target data-motion="card-routing-shuffle">
  <div class="card-routing-shuffle__grid" data-motion="grid">
    <div class="card-routing-shuffle__col">
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--yellow" data-motion="y0"><div class="card-routing-shuffle__inner"><p class="card-routing-shuffle__title" data-motion="title-y0">Machine Learning</p><img class="card-routing-shuffle__arrow" src="assets/arrow-dark.svg" width="24" height="24" alt="" data-motion="arrow-y0"></div></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p0a"><img class="card-routing-shuffle__photo" src="assets/photo-1.jpg" alt="" decoding="sync"></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p0b"><img class="card-routing-shuffle__photo" src="assets/photo-2.jpg" alt="" decoding="sync"></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--indigo" data-motion="i0"><div class="card-routing-shuffle__inner"><p class="card-routing-shuffle__title" data-motion="title-i0">Trading</p><img class="card-routing-shuffle__arrow" src="assets/arrow-dark.svg" width="24" height="24" alt="" data-motion="arrow-i0"></div></div>
    </div>
    <div class="card-routing-shuffle__col">
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--green" data-motion="g1"><div class="card-routing-shuffle__inner"><p class="card-routing-shuffle__title" data-motion="title-g1">Technology</p><img class="card-routing-shuffle__arrow" src="assets/arrow-light.svg" width="24" height="24" alt="" data-motion="arrow-g1"></div></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p1a"><img class="card-routing-shuffle__photo" src="assets/photo-3.jpg" alt="" decoding="sync"></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p1b"><img class="card-routing-shuffle__photo" src="assets/photo-4.jpg" alt="" decoding="sync"></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--indigo" data-motion="i1"><div class="card-routing-shuffle__inner"><p class="card-routing-shuffle__title" data-motion="title-i1">Trading</p><img class="card-routing-shuffle__arrow" src="assets/arrow-dark.svg" width="24" height="24" alt="" data-motion="arrow-i1"></div></div>
    </div>
    <div class="card-routing-shuffle__col">
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--green" data-motion="g2"><div class="card-routing-shuffle__inner"><p class="card-routing-shuffle__title" data-motion="title-g2">Technology</p><img class="card-routing-shuffle__arrow" src="assets/arrow-light.svg" width="24" height="24" alt="" data-motion="arrow-g2"></div></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p2a"><img class="card-routing-shuffle__photo" src="assets/photo-5.jpg" alt="" decoding="sync"></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--video" data-motion="v2"><video class="card-routing-shuffle__photo" src="assets/home-video.mp4" autoplay muted loop playsinline preload="auto"></video></div>
      <div class="card-routing-shuffle__cell card-routing-shuffle__cell--yellow" data-motion="y2"><div class="card-routing-shuffle__inner"><p class="card-routing-shuffle__title" data-motion="title-y2">Machine Learning</p><img class="card-routing-shuffle__arrow" src="assets/arrow-dark.svg" width="24" height="24" alt="" data-motion="arrow-y2"></div></div>
    </div>
  </div>
  <div class="card-routing-shuffle__float">
    <button type="button" class="card-routing-shuffle__shuffle" data-motion="shuffle">
      <svg class="card-routing-shuffle__ring" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle class="card-routing-shuffle__ring-track" cx="12" cy="12" r="9"/><circle class="card-routing-shuffle__ring-fill" cx="12" cy="12" r="9" pathLength="1"/></svg>
      <span>Shuffle</span>
    </button>
  </div>
</section>
