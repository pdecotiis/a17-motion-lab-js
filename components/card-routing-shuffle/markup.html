<section class="card-routing-shuffle" data-motion-target data-motion="card-routing-shuffle">
  <div class="card-routing-shuffle__grid" data-motion="grid">
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p01"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p02"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--yellow" data-motion="y0"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--indigo" data-motion="i0"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--video" data-motion="v0"><span class="card-routing-shuffle__play" aria-hidden="true"></span></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--green" data-motion="g1"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--indigo" data-motion="i1"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p11"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p12"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--video" data-motion="v1"><span class="card-routing-shuffle__play" aria-hidden="true"></span></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p22"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--green" data-motion="g2"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--picture" data-motion="p21"></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--video" data-motion="v2"><span class="card-routing-shuffle__play" aria-hidden="true"></span></div>
    <div class="card-routing-shuffle__cell card-routing-shuffle__cell--yellow" data-motion="y2"></div>
  </div>
  <button type="button" class="card-routing-shuffle__shuffle" data-motion="shuffle">Shuffle</button>
</section>
