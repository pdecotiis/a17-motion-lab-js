<section class="card-routing-morph" data-motion-target data-motion="card-routing-morph">
  <div class="card-routing-morph__stage" data-motion="stage">
    <div class="card-routing-morph__panel" data-motion="panel-1"><div class="card-routing-morph__inner" data-motion="fade-1">
      <div class="card-routing-morph__column">
        <div class="card-routing-morph__cell" data-motion="m-card"><div data-motion="shape-1" class="card-routing-morph__fill card-routing-morph__card card-routing-morph__card--orange"><div class="card-routing-morph__route" data-motion="route-m-card"><p class="card-routing-morph__title">Machine Learning</p><img class="card-routing-morph__arrow" src="assets/arrow-dark.svg" alt=""></div></div></div>
        <div class="card-routing-morph__cell card-routing-morph__cell--row" data-motion="m-row"><div data-motion="shape-1" class="card-routing-morph__square"><img data-motion="pic-1" class="card-routing-morph__pic" src="assets/hands.jpg" alt="" decoding="sync"></div><div data-motion="shape-1" class="card-routing-morph__square"><img data-motion="pic-1" class="card-routing-morph__pic" src="assets/pattern-yellow.jpg" alt="" decoding="sync"></div></div>
      </div>
      <div class="card-routing-morph__column">
        <div class="card-routing-morph__cell" data-motion="m-large"><div data-motion="shape-1" class="card-routing-morph__fill"><img data-motion="pic-1" class="card-routing-morph__pic" src="assets/machine-learning-large.jpg" alt="" decoding="sync"></div></div>
      </div>
    </div></div>
    <div class="card-routing-morph__panel" data-motion="panel-2"><div class="card-routing-morph__inner" data-motion="fade-2">
      <div class="card-routing-morph__column">
        <div class="card-routing-morph__cell" data-motion="t-large"><div data-motion="shape-2" class="card-routing-morph__fill"><img data-motion="pic-2" class="card-routing-morph__pic" src="assets/trading-large.jpg" alt="" decoding="sync"></div></div>
      </div>
      <div class="card-routing-morph__column">
        <div class="card-routing-morph__cell card-routing-morph__cell--row" data-motion="t-row"><div data-motion="shape-2" class="card-routing-morph__square"><img data-motion="pic-2" class="card-routing-morph__pic" src="assets/pattern-green.jpg" alt="" decoding="sync"></div><div data-motion="shape-2" class="card-routing-morph__square"><img data-motion="pic-2" class="card-routing-morph__pic" src="assets/trading-small.jpg" alt="" decoding="sync"></div></div>
        <div class="card-routing-morph__cell" data-motion="t-card"><div data-motion="shape-2" class="card-routing-morph__fill card-routing-morph__card card-routing-morph__card--indigo"><div class="card-routing-morph__route" data-motion="route-t-card"><p class="card-routing-morph__title">Trading</p><img class="card-routing-morph__arrow" src="assets/arrow-dark.svg" alt=""></div></div></div>
      </div>
    </div></div>
    <div class="card-routing-morph__panel" data-motion="panel-3"><div class="card-routing-morph__inner" data-motion="fade-3">
      <div class="card-routing-morph__column">
        <div class="card-routing-morph__cell" data-motion="e-card"><div data-motion="shape-3" class="card-routing-morph__fill card-routing-morph__card card-routing-morph__card--yellow"><div class="card-routing-morph__route" data-motion="route-e-card"><p class="card-routing-morph__title">Technology</p><img class="card-routing-morph__arrow" src="assets/arrow-dark.svg" alt=""></div></div></div>
        <div class="card-routing-morph__cell card-routing-morph__cell--row" data-motion="e-row"><div data-motion="shape-3" class="card-routing-morph__square"><img data-motion="pic-3" class="card-routing-morph__pic" src="assets/pattern-orange.jpg" alt="" decoding="sync"></div><div data-motion="shape-3" class="card-routing-morph__square"><img data-motion="pic-3" class="card-routing-morph__pic" src="assets/hands.jpg" alt="" decoding="sync"></div></div>
      </div>
      <div class="card-routing-morph__column">
        <div class="card-routing-morph__cell" data-motion="e-large"><div data-motion="shape-3" class="card-routing-morph__fill"><img data-motion="pic-3" class="card-routing-morph__pic" src="assets/technology-large.jpg" alt="" decoding="sync"></div></div>
      </div>
    </div></div>
  </div>
  <div class="card-routing-morph__bar">
    <div class="card-routing-morph__pager" data-motion="pager" role="group" aria-label="Pages">
      <button type="button" class="card-routing-morph__pager-button" data-motion="prev" aria-label="Previous"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button>
      <button type="button" class="card-routing-morph__pager-button" data-motion="next" aria-label="Next"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
      <button type="button" class="card-routing-morph__pager-button card-routing-morph__playpause" data-motion="playpause" aria-label="Pause" aria-pressed="false">
        <svg class="card-routing-morph__icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="6" width="3.5" height="12" rx="1"/><rect x="13.5" y="6" width="3.5" height="12" rx="1"/></svg>
        <svg class="card-routing-morph__icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2A.8.8 0 0 0 8 5.8z"/></svg>
      </button>
    </div>
  </div>
  <div class="card-routing-morph__float" data-motion="float">
    <div class="card-routing-morph__dots" data-motion="dots" role="group" aria-label="Slides">
      <button type="button" class="card-routing-morph__dot" data-motion="dot-1" aria-label="Show slide 1"><span class="card-routing-morph__dot-fill"></span></button>
      <button type="button" class="card-routing-morph__dot" data-motion="dot-2" aria-label="Show slide 2"><span class="card-routing-morph__dot-fill"></span></button>
      <button type="button" class="card-routing-morph__dot" data-motion="dot-3" aria-label="Show slide 3"><span class="card-routing-morph__dot-fill"></span></button>
    </div>
  </div>
</section>
