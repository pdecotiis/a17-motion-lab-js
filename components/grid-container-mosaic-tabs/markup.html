<section class="grid-container-mosaic-tabs" data-motion-target data-motion="grid-container-mosaic-tabs">
  <div class="grid-container-mosaic-tabs__tabs" role="tablist" data-motion="tabs">
    <button class="grid-container-mosaic-tabs__tab" type="button" role="tab" aria-selected="true" data-motion="tab-ml">Machine Learning</button>
    <button class="grid-container-mosaic-tabs__tab" type="button" role="tab" aria-selected="false" data-motion="tab-trading">Trading</button>
    <button class="grid-container-mosaic-tabs__tab" type="button" role="tab" aria-selected="false" data-motion="tab-technology">Technology</button>
  </div>
  <div class="grid-container-mosaic-tabs__bento" data-motion="bento">
    <div class="grid-container-mosaic-tabs__cell grid-container-mosaic-tabs__big" data-motion="big">
      <img class="grid-container-mosaic-tabs__photo" src="assets/photo-1.png" alt="" data-motion="big-ml">
      <img class="grid-container-mosaic-tabs__photo" src="assets/photo-2.png" alt="" data-motion="big-trading">
      <img class="grid-container-mosaic-tabs__photo" src="assets/photo-3.png" alt="" data-motion="big-technology">
    </div>
    <div class="grid-container-mosaic-tabs__cell grid-container-mosaic-tabs__small" data-motion="small">
      <img class="grid-container-mosaic-tabs__photo" src="assets/photo-2.png" alt="" data-motion="small-ml">
      <img class="grid-container-mosaic-tabs__photo" src="assets/photo-3.png" alt="" data-motion="small-trading">
      <img class="grid-container-mosaic-tabs__photo" src="assets/photo-1.png" alt="" data-motion="small-technology">
    </div>
    <div class="grid-container-mosaic-tabs__cell grid-container-mosaic-tabs__card" data-motion="card">
      <div class="grid-container-mosaic-tabs__heading">
        <p class="grid-container-mosaic-tabs__title" data-motion="title-ml">Machine Learning</p>
        <p class="grid-container-mosaic-tabs__title" data-motion="title-trading">Trading</p>
        <p class="grid-container-mosaic-tabs__title" data-motion="title-technology">Technology</p>
      </div>
      <img class="grid-container-mosaic-tabs__arrow" src="assets/arrow-right.svg" width="24" height="24" alt="" data-motion="arrow">
    </div>
  </div>
</section>
