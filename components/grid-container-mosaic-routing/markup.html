<section class="grid-container-mosaic-routing" data-motion-target data-motion="grid-container-mosaic-routing">
  <div class="grid-container-mosaic-routing__slot" data-motion="slot">
    <div class="grid-container-mosaic-routing__bar grid-container-mosaic-routing__bar--green" data-motion="bar-1"></div>

      <div class="grid-container-mosaic-routing__tile grid-container-mosaic-routing__tile--orange grid-container-mosaic-routing__span-2" data-motion="tile-1">

          <p class="grid-container-mosaic-routing__title" data-motion="title">Machine Learning</p>
        </div>
        <div class="grid-container-mosaic-routing__actions" data-motion="actions">

      <div class="grid-container-mosaic-routing__image" data-motion="image-1">

      <div class="grid-container-mosaic-routing__image" data-motion="image-2">
        <div class="grid-container-mosaic-routing__texture"></div>
        <img class="grid-container-mosaic-routing__photo" src="assets/photo-2.png" alt="">

      <div class="grid-container-mosaic-routing__image grid-container-mosaic-routing__span-2" data-motion="image-3">
        <div class="grid-container-mosaic-routing__texture"></div>
        <img class="grid-container-mosaic-routing__photo" src="assets/photo-3.png" alt="">

      <div class="grid-container-mosaic-routing__tile grid-container-mosaic-routing__tile--lilac grid-container-mosaic-routing__span-2" data-motion="tile-2"></div>
    </div>
  </div>
</section>
