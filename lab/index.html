<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A17 Motion Lab</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="lab-header">
      <div class="lab-header__brand">
        <span class="lab-header__logo">Motion Lab</span>
      </div>
      <nav class="lab-nav" role="navigation" aria-label="View navigation">
        <button class="lab-nav__btn" data-view="library" aria-pressed="false">Library</button>
        <button class="lab-nav__btn" data-view="component" aria-pressed="false">Component</button>
        <button class="lab-nav__btn" data-view="page" aria-pressed="false">Page</button>
        <button class="lab-nav__btn" data-view="tokens" aria-pressed="false">Tokens</button>
        <button class="lab-nav__btn" data-view="presets" aria-pressed="false">Presets</button>
      </nav>
      <div class="lab-header__controls">
        <div class="lab-segmented" role="group" aria-label="Runtime">
          <button type="button" class="lab-segmented__btn" id="runtime-css" aria-pressed="true" title="Play with CSS: each version's easing curve">CSS</button>
          <button type="button" class="lab-segmented__btn" id="runtime-motion" aria-pressed="false" title="Play with Motion (motion.dev), with real springs">Motion</button>
        </div>
        <label class="lab-control-label">
          Speed
          <select id="speed-control" class="lab-select">
            <option value="0.25">0.25×</option>
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <button class="lab-btn lab-btn--icon" id="settings-btn" aria-label="Settings" aria-haspopup="dialog" title="Settings">⚙</button>
        <button class="lab-btn lab-btn--icon" id="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark">☀</button>
      </div>
    </header>

    <div id="reduced-motion-notice" class="lab-notice lab-notice--hidden" role="alert">
      prefers-reduced-motion is active — animations are minimized.
    </div>

    <main id="main-content" class="lab-main">
      <!-- Rendered by main.ts -->
    </main>
  </div>

  <dialog id="settings-dialog" class="lab-settings" aria-labelledby="settings-title">
    <header class="lab-settings__header">
      <h2 id="settings-title" class="lab-settings__title">Settings</h2>
      <button type="button" class="lab-btn lab-btn--icon" id="settings-close" aria-label="Close settings">×</button>
    </header>
    <section class="lab-settings__section" aria-labelledby="settings-scale-title">
      <h3 id="settings-scale-title" class="lab-settings__heading">Global scale</h3>
      <p class="lab-settings__intro">How the distance, duration, delay, opacity and scale tokens get their values. You won't change this often: pick a scale, see what it would do to the tokens, then apply it.</p>
      <div id="settings-body"></div>
    </section>
  </dialog>
  <script type="module" src="./main.ts"></script>
</body>
</html>
